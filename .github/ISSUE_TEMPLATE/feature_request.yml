name: Feature request
description: Suggest a focused improvement to AgentConfigScore.
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What real workflow or failure mode would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention existing workarounds or adjacent tools if relevant.
  - type: checkboxes
    id: principles
    attributes:
      label: Project fit
      options:
        - label: I understand the core scanner aims to stay deterministic and explainable.
          required: true
