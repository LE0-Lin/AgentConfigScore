name: retag-v0.5.2

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  retag:
    if: contains(github.event.head_commit.message, 'v0.5.2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move v0.5.2 tag to the Marketplace release commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v0.5.2 "$GITHUB_SHA"
          git push origin refs/tags/v0.5.2 --force
