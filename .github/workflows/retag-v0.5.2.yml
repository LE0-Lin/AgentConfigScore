name: retag-v0.5.2

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  retag:
    if: contains(github.event.head_commit.message, 'v0.5.2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Finalize clean v0.5.2 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/retag-v0.5.2.yml
          git commit -m "chore: remove one-shot v0.5.2 retag workflow"
          git push origin HEAD:main

          git tag -f v0.5.2 HEAD
          git push origin refs/tags/v0.5.2 --force
