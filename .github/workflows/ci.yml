name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Validate installed doctor entrypoint
        run: |
          agent-config-score doctor . --json > "$RUNNER_TEMP/agent-config-score-doctor.json"
          python - "$RUNNER_TEMP/agent-config-score-doctor.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["ok"] is True
          assert data["errors"] == 0
          assert any(check["name"] == "config" for check in data["checks"])
          PY
      - name: Generate and validate SARIF
        run: |
          agent-config-score . --fail-under 90 --sarif "$RUNNER_TEMP/agent-config-score.sarif"
          python - "$RUNNER_TEMP/agent-config-score.sarif" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["version"] == "2.1.0"
          assert data["runs"][0]["tool"]["driver"]["name"] == "AgentConfigScore"
          PY
