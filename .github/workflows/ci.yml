name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Validate installed doctor entrypoint
        shell: bash
        run: |
          agent-config-score doctor . --json > .ci-doctor.json
          python - .ci-doctor.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["ok"] is True
          assert data["errors"] == 0
          assert any(check["name"] == "config" for check in data["checks"])
          PY
      - name: Generate and validate SARIF
        shell: bash
        run: |
          agent-config-score . --fail-under 90 --sarif .ci-agent-config-score.sarif
          python - .ci-agent-config-score.sarif <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["version"] == "2.1.0"
          assert data["runs"][0]["tool"]["driver"]["name"] == "AgentConfigScore"
          PY

  score-history:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/score-history.yml
    with:
      retention_days: 1
