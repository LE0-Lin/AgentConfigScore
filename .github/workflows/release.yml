name: release

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.preflight.outputs.skip }}
      existing_tag: ${{ steps.preflight.outputs.existing_tag }}
      existing_release: ${{ steps.preflight.outputs.existing_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_exists=false
          tag_exists=false

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tag_exists=true
            tagged_sha="$(git rev-list -n 1 "$TAG")"
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              if gh release view "$TAG" >/dev/null 2>&1; then
                echo "$TAG already exists at $tagged_sha; current commit is $GITHUB_SHA. Leaving the existing release untouched."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "existing_tag=true" >> "$GITHUB_OUTPUT"
                echo "existing_release=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "error: $TAG already points to $tagged_sha, not current commit $GITHUB_SHA" >&2
              exit 2
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            release_exists=true
            if [[ "$tag_exists" != "true" ]]; then
              echo "error: GitHub Release $TAG exists but its tag was not fetched locally" >&2
              exit 2
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "existing_tag=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "existing_release=$release_exists" >> "$GITHUB_OUTPUT"

      - name: Build wheel and source distribution
        if: steps.preflight.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

      - name: Validate built wheel
        if: steps.preflight.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/agent-config-score-release-test"
          "$RUNNER_TEMP/agent-config-score-release-test/bin/python" -m pip install "$wheel"
          cd "$RUNNER_TEMP"
          actual="$("$RUNNER_TEMP/agent-config-score-release-test/bin/agent-config-score" --version)"
          test "$actual" = "AgentConfigScore $VERSION"
          "$RUNNER_TEMP/agent-config-score-release-test/bin/agent-config-score" --help >/dev/null

      - name: Store verified distributions
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions-${{ steps.version.outputs.version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub release
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Retrieve verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions-${{ needs.build.outputs.version }}
          path: dist

      - name: Generate checksums
        shell: bash
        run: (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS.txt)

      - name: Publish verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          EXISTING_TAG: ${{ needs.build.outputs.existing_tag }}
          EXISTING_RELEASE: ${{ needs.build.outputs.existing_release }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXISTING_RELEASE" == "true" ]]; then
            gh release upload "$TAG" dist/* --clobber
          elif [[ "$EXISTING_TAG" == "true" ]]; then
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "AgentConfigScore $TAG" \
              --generate-notes
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "AgentConfigScore $TAG" \
              --generate-notes
          fi

      - name: Update rolling v0 branch
        shell: bash
        run: git push origin "$GITHUB_SHA:refs/heads/v0" --force

  pypi-publish:
    name: Publish to PyPI
    needs: [build, github-release]
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-config-score
    permissions:
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, 2026-07-28
