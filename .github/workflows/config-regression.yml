name: agent-config-regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dogfood the local AgentConfigScore action
        uses: ./
        with:
          max-drop: "0"
          fail-on-new-errors: "true"
