name: agent-config-regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dogfood the local AgentConfigScore action
        id: acs
        uses: ./
      - name: Validate structured action outputs
        shell: bash
        env:
          BASE_SCORE: ${{ steps.acs.outputs.base-score }}
          HEAD_SCORE: ${{ steps.acs.outputs.head-score }}
          DELTA: ${{ steps.acs.outputs.delta }}
          NEW_FINDINGS: ${{ steps.acs.outputs.new-findings }}
          NEW_ERRORS: ${{ steps.acs.outputs.new-errors }}
          NEW_RULE_COUNTS: ${{ steps.acs.outputs.new-rule-counts }}
          RESOLVED_FINDINGS: ${{ steps.acs.outputs.resolved-findings }}
        run: |
          set -euo pipefail
          [[ "$BASE_SCORE" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SCORE" =~ ^[0-9]+$ ]]
          [[ "$DELTA" =~ ^-?[0-9]+$ ]]
          [[ "$NEW_FINDINGS" =~ ^[0-9]+$ ]]
          [[ "$NEW_ERRORS" =~ ^[0-9]+$ ]]
          [[ "$RESOLVED_FINDINGS" =~ ^[0-9]+$ ]]
          (( DELTA == HEAD_SCORE - BASE_SCORE ))
          echo "AgentConfigScore outputs: $BASE_SCORE -> $HEAD_SCORE ($DELTA), $NEW_ERRORS new errors"
          python - <<'PY'
          import json
          import os
          rows = json.loads(os.environ['NEW_RULE_COUNTS'])
          assert isinstance(rows, list)
          assert sum(row['count'] for row in rows) == int(os.environ['NEW_FINDINGS'])
          assert sum(row['count'] for row in rows if row['severity'] == 'error') == int(os.environ['NEW_ERRORS'])
          assert all(set(row) == {'code', 'severity', 'count'} for row in rows)
          PY
