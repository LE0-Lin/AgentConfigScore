<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AgentConfigScore workflow</title>
  <desc id="desc">Configure agent instructions, guard every pull request against a baseline, and retain an auditable score history.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79c0ff"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <text x="55" y="57" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">One small policy loop. Three durable outcomes.</text>
  <text x="55" y="87" fill="#8fa3b8" font-family="Segoe UI, Arial, sans-serif" font-size="17">From local instructions to merge protection and reviewable evidence.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="125" width="305" height="230" rx="18" fill="#0d1626" stroke="#2c3e55" stroke-width="2"/>
    <rect x="447" y="125" width="305" height="230" rx="18" fill="#0d1626" stroke="#2c3e55" stroke-width="2"/>
    <rect x="840" y="125" width="305" height="230" rx="18" fill="#0d1626" stroke="#2c3e55" stroke-width="2"/>
  </g>

  <circle cx="95" cy="166" r="20" fill="#17344f" stroke="#2b6190"/>
  <text x="95" y="173" text-anchor="middle" fill="#79c0ff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">1</text>
  <text x="128" y="173" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Configure once</text>
  <text x="85" y="220" fill="#7ee787" font-family="Consolas, monospace" font-size="17">agent-config-score init</text>
  <text x="85" y="258" fill="#8fa3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Policy + GitHub workflow</text>
  <text x="85" y="286" fill="#8fa3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">AGENTS.md · CLAUDE.md</text>
  <text x="85" y="314" fill="#8fa3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Cursor · Copilot · Gemini</text>

  <circle cx="487" cy="166" r="20" fill="#17344f" stroke="#2b6190"/>
  <text x="487" y="173" text-anchor="middle" fill="#79c0ff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">2</text>
  <text x="520" y="173" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Guard every PR</text>
  <rect x="477" y="208" width="245" height="38" rx="8" fill="#162235"/>
  <text x="599" y="233" text-anchor="middle" fill="#e6edf3" font-family="Consolas, monospace" font-size="16">baseline → candidate</text>
  <text x="477" y="278" fill="#7ee787" font-family="Segoe UI, Arial, sans-serif" font-size="16">✓ no regression</text>
  <text x="477" y="309" fill="#ff7b72" font-family="Segoe UI, Arial, sans-serif" font-size="16">✕ unsafe change blocked</text>

  <circle cx="880" cy="166" r="20" fill="#17344f" stroke="#2b6190"/>
  <text x="880" y="173" text-anchor="middle" fill="#79c0ff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3</text>
  <text x="913" y="173" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Keep evidence</text>
  <polyline points="875,294 938,267 1001,235 1085,198" fill="none" stroke="#79c0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="875" cy="294" r="7" fill="#7ee787"/>
  <circle cx="938" cy="267" r="7" fill="#7ee787"/>
  <circle cx="1001" cy="235" r="7" fill="#7ee787"/>
  <circle cx="1085" cy="198" r="7" fill="#7ee787"/>
  <text x="875" y="327" fill="#8fa3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">JSON · HTML · badge · history</text>

  <line x1="375" y1="240" x2="425" y2="240" stroke="#79c0ff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="767" y1="240" x2="817" y2="240" stroke="#79c0ff" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
