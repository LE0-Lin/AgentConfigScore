<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Review workflow</title>
  <desc id="desc">Use the reviewed baseline policy to check a proposed change and keep evidence about the decision.</desc>
  <rect width="1200" height="420" rx="22" fill="#0B1422"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="50" y="46" fill="#76E5C1" font-size="17" font-weight="700" letter-spacing="2">AGENTCONFIGSCORE / WORKFLOW</text>
    <text x="49" y="100" fill="#ECF3F8" font-size="39" font-weight="700">Review changes against the baseline.</text>
    <g fill="#111E2D" stroke="#304457" stroke-width="2">
      <rect x="50" y="135" width="350" height="220" rx="16"/>
      <rect x="425" y="135" width="350" height="220" rx="16"/>
      <rect x="800" y="135" width="350" height="220" rx="16"/>
    </g>
    <path d="M400 245h24m-8-6 8 6-8 6m359-6h24m-8-6 8 6-8 6" fill="none" stroke="#76E5C1" stroke-width="2"/>
    <g fill="#76E5C1" font-size="16" font-weight="700" letter-spacing="1">
      <text x="75" y="173">01 / BASELINE</text>
      <text x="450" y="173">02 / CHANGE</text>
      <text x="825" y="173">03 / EVIDENCE</text>
    </g>
    <g fill="#ECF3F8" font-size="27" font-weight="700">
      <text x="75" y="222">Set the policy</text>
      <text x="450" y="222">Compare the PR</text>
      <text x="825" y="222">Review the finding</text>
    </g>
    <g fill="#A9BED0" font-size="19">
      <text x="75" y="261">Commit thresholds and</text><text x="75" y="287">reviewed exceptions.</text>
      <text x="450" y="261">Apply the baseline policy</text><text x="450" y="287">to the proposed change.</text>
      <text x="825" y="261">Inspect rule IDs, source paths,</text><text x="825" y="287">and the CI exit status.</text>
    </g>
    <g fill="#76E5C1" font-family="Consolas, monospace" font-size="17">
      <text x="75" y="329">agent-config-score init</text>
      <text x="450" y="329">agent-config-score diff</text>
      <text x="825" y="329">JSON · HTML · SARIF</text>
    </g>
    <text x="50" y="393" fill="#A9BED0" font-size="16">Local analysis  /  Reviewed baseline policy  /  Deterministic findings</text>
  </g>
</svg>
